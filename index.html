<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Каталог — Алгоритм.Дело</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f7fbf8;
            color: #1e2e2a;
            padding: 16px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            padding: 8px 0 16px;
        }
        .header h1 {
            font-size: 24px;
            color: #0e2f24;
        }
        .header h1 span {
            color: #2b7a4e;
        }
        .header p {
            font-size: 15px;
            color: #3b5f4e;
            margin-top: 2px;
        }

        .bot-greeting {
            background: #e2f0e8;
            border-radius: 16px;
            padding: 12px 16px;
            margin-bottom: 18px;
            font-size: 14px;
            color: #1a4a3a;
            text-align: center;
            border-left: 4px solid #3a7a5a;
        }
        .bot-greeting strong {
            color: #0e2f24;
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        @media (max-width: 520px) {
            .catalog-grid {
                grid-template-columns: 1fr;
            }
        }

        .product-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 18px 16px 20px;
            box-shadow: 0 2px 12px rgba(40, 80, 60, 0.05);
            border: 1px solid rgba(80, 140, 110, 0.08);
            display: flex;
            flex-direction: column;
            transition: 0.2s;
        }
        .product-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(50, 110, 80, 0.08);
        }
        .product-card h3 {
            font-size: 18px;
            color: #0e2f24;
            margin-bottom: 2px;
        }
        .product-price {
            font-size: 20px;
            font-weight: 700;
            color: #1f6a44;
            margin: 4px 0 6px;
        }
        .product-price small {
            font-weight: 400;
            font-size: 14px;
            color: #4d7a62;
        }
        .product-desc {
            color: #2b4a3a;
            font-size: 14px;
            flex: 1;
            margin-bottom: 12px;
        }
        .btn-order {
            background: #2d6b4a;
            color: #ffffff;
            border: none;
            padding: 10px 0;
            border-radius: 60px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.25s;
            width: 100%;
            text-align: center;
        }
        .btn-order:hover {
            background: #1f543a;
        }

        /* ===== МОДАЛ ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(20, 45, 35, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            padding: 16px;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal {
            background: #ffffff;
            max-width: 480px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 28px;
            padding: 28px 24px;
            box-shadow: 0 40px 80px rgba(0, 20, 10, 0.25);
            animation: fadeUp 0.2s ease;
            text-align: center;
        }
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: scale(0.96) translateY(12px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        .modal-close {
            float: right;
            background: #eaf3ee;
            border: none;
            width: 38px;
            height: 38px;
            border-radius: 60px;
            font-size: 22px;
            cursor: pointer;
            color: #1f4a36;
            transition: 0.2s;
            font-weight: 300;
            margin-top: -8px;
            margin-right: -8px;
        }
        .modal-close:hover {
            background: #cde0d4;
        }

        .modal .emoji-big {
            font-size: 56px;
            display: block;
            margin: 8px 0 12px;
        }
        .modal h2 {
            font-size: 24px;
            color: #0e2f24;
            margin-bottom: 4px;
        }
        .modal .price {
            font-size: 20px;
            font-weight: 700;
            color: #1f6a44;
            margin-bottom: 16px;
        }
        .modal .desc {
            font-size: 15px;
            color: #1f3f32;
            white-space: pre-wrap;
            line-height: 1.6;
            border-top: 1px solid #d5e8dd;
            padding-top: 16px;
            margin-bottom: 20px;
            text-align: left;
        }

        .btn-primary {
            background: #2d6b4a;
            color: #ffffff;
            border: none;
            padding: 14px 0;
            border-radius: 60px;
            font-weight: 600;
            font-size: 18px;
            cursor: pointer;
            transition: 0.25s;
            width: 100%;
            text-align: center;
        }
        .btn-primary:hover {
            background: #1f543a;
        }

        /* ===== СООБЩЕНИЕ ПОСЛЕ ЗАКАЗА ===== */
        .success-message {
            display: none;
            padding: 20px 0;
        }
        .success-message.show {
            display: block;
        }
        .success-message .emoji {
            font-size: 64px;
            display: block;
            margin-bottom: 12px;
        }
        .success-message h3 {
            color: #1f6a44;
            font-size: 24px;
            margin-bottom: 6px;
        }
        .success-message p {
            color: #3d6a53;
            font-size: 16px;
        }

        footer {
            text-align: center;
            padding: 20px 0 4px;
            color: #3d6a53;
            font-size: 13px;
            border-top: 1px solid #d2e6da;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">

        <div class="header">
            <h1>Алгоритм.<span>Дело</span></h1>
            <p>Выберите услугу</p>
        </div>

        <div class="bot-greeting">
            🤖 <strong>Алгоритм.Дело</strong> — разработка сайтов, ботов и игр.<br />
            Выберите услугу, и мы свяжемся с вами.
        </div>

        <div class="catalog-grid" id="catalogGrid"></div>

        <footer>
            &copy; 2026 Алгоритм.Дело
        </footer>
    </div>

    <!-- ===== МОДАЛ ===== -->
    <div class="modal-overlay" id="orderModal">
        <div class="modal">
            <button class="modal-close" onclick="closeModal()">×</button>

            <!-- Детали услуги -->
            <div id="serviceDetails">
                <span class="emoji-big">📦</span>
                <h2 id="modalTitle">Название</h2>
                <div class="price" id="modalPrice">от 0 ₽</div>
                <div class="desc" id="modalDesc">Описание</div>
                <button class="btn-primary" id="orderBtn">📤 Заказать</button>
            </div>

            <!-- Сообщение после заказа -->
            <div class="success-message" id="successMessage">
                <span class="emoji">✅</span>
                <h3>Заявка отправлена!</h3>
                <p>Скоро свяжемся для уточнения деталей</p>
            </div>
        </div>
    </div>

    <script>
        // ===== TELEGRAM WEBAPP =====
        const tg = window.Telegram?.WebApp;
        let userData = null;

        if (tg) {
            tg.expand();
            userData = tg.initDataUnsafe?.user || null;
            console.log('WebApp загружен в Telegram');
        }

        // ===== ДАННЫЕ ТОВАРОВ =====
        const products = [{
            id: 'tg',
            name: 'Telegram-бот',
            price: 'от 2 500 ₽',
            short: 'Бот с приветствием, FAQ, сбором заявок в таблицу и уведомлениями.',
            full: 'Что входит: Бот с базовыми сценариями: приветствие, ответы на частые вопросы, сбор заявок в Google Sheets, уведомления администратору.\n\nКому подойдёт: Сфера услуг, консультанты, кофейни, репетиторы, адвокаты.'
        }, {
            id: 'maxbot',
            name: 'Макс-бот',
            price: 'от 3 000 ₽',
            short: 'Многопоточные сценарии, оплата картой, база клиентов, рассылки.',
            full: 'Что входит: Многопоточные сценарии (ветвление диалога в 10+ направлений), оплата через карту внутри бота, привязка к базе данных клиентов, рассылки.\n\nКому подойдёт: Онлайн-школы, интернет-магазины, сети клиник, автомойки.'
        }, {
            id: 'landing',
            name: 'Landing Site',
            price: 'от 4 000 ₽',
            short: 'Одностраничный сайт с высокой конверсией, метриками и адаптивом.',
            full: 'Что входит: Одностраничный сайт с чёткой структурой. Настройка форм, метрики, базовый SEO, адаптация под телефоны.\n\nКому подойдёт: Запуск нового продукта, акции, вебинары, сбор лидов.'
        }, {
            id: 'site',
            name: 'Обычный сайт',
            price: 'от 9 990 ₽',
            short: '3–5 страниц, админка, SSL, регистрация в поисковиках.',
            full: 'Что входит: 3-5 страниц (Главная, Услуги, О компании, Контакты). Установка на хостинг, SSL, админка для редактирования.\n\nКому подойдёт: Строительные компании, стоматологии, юр. бюро, салоны красоты.'
        }, {
            id: 'catalog',
            name: 'Сайт с каталогом товаров',
            price: 'от 15 000 ₽',
            short: 'Умная витрина: фильтры, поиск, корзина, заказ в пару касаний.',
            full: 'Что входит: Категории, фильтры, поиск, детальные карточки товара, корзина, оформление заказа.\n\nКому подойдёт: Магазины одежды, стройматериалов, мебели, зоотоваров.'
        }, {
            id: 'db',
            name: 'Сайт с базой данных',
            price: 'от 25 000 ₽',
            short: 'Личные кабинеты, отчёты, интеграции, защита от утечек.',
            full: 'Что входит: Структура данных, личные кабинеты, история действий, выгрузка отчётов, интеграция с API.\n\nКому подойдёт: Логистика, агрегаторы услуг, сети ресторанов, сервисные центры.'
        }, {
            id: 'unity',
            name: 'Unity (игры / симуляторы)',
            price: 'Договорная',
            short: '2D/3D игры, симуляторы, визуализация, помощь в доработке.',
            full: 'Что входит: Разработка 2D/3D игр под Windows, Android, iOS. Симуляторы, визуализация, помощь в доработке проектов.\n\nКому подойдёт: Гейм-студии, архитекторы, производственные компании.'
        }];

        // ===== РЕНДЕР КАРТОЧЕК =====
        const grid = document.getElementById('catalogGrid');
        products.forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <h3>${p.name}</h3>
                <div class="product-price">${p.price}</div>
                <div class="product-desc">${p.short}</div>
                <button class="btn-order" data-id="${p.id}">Заказать</button>
            `;
            grid.appendChild(card);
        });

        // ===== ОТКРЫТИЕ МОДАЛА =====
        let selectedProduct = null;

        document.addEventListener('click', function(e) {
            if (e.target.classList.contains('btn-order')) {
                const id = e.target.dataset.id;
                selectedProduct = products.find(p => p.id === id);
                if (selectedProduct) {
                    document.getElementById('modalTitle').textContent = selectedProduct.name;
                    document.getElementById('modalPrice').textContent = selectedProduct.price;
                    document.getElementById('modalDesc').textContent = selectedProduct.full;
                    
                    // Показываем детали, скрываем успех
                    document.getElementById('serviceDetails').style.display = 'block';
                    document.getElementById('successMessage').classList.remove('show');
                    
                    document.getElementById('orderModal').classList.add('active');
                    document.body.style.overflow = 'hidden';
                }
            }
        });

        // ===== ЗАКРЫТИЕ МОДАЛА =====
        function closeModal() {
            document.getElementById('orderModal').classList.remove('active');
            document.body.style.overflow = '';
        }

        document.querySelector('.modal-overlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ===== ЗАКАЗ =====
        document.getElementById('orderBtn').addEventListener('click', function() {
            if (!selectedProduct) return;

            // Данные пользователя из Telegram
            const firstName = userData?.first_name || 'Пользователь';
            const lastName = userData?.last_name || '';
            const username = userData?.username || 'без_username';
            const userId = userData?.id || 'anonymous';
            const fullName = `${firstName} ${lastName}`.trim();

            // ===== ОТПРАВКА АДМИНУ =====
            const data = {
                name: fullName,
                username: username,
                user_id: userId,
                service: selectedProduct.name,
                price: selectedProduct.price
            };

            if (tg) {
                try {
                    tg.sendData(JSON.stringify(data));
                } catch (error) {
                    console.error('Ошибка отправки:', error);
                }
            } else {
                fetch('/webapp_data', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                }).catch(error => console.error('Ошибка:', error));
            }

            // ===== ПОКАЗЫВАЕМ КРАСИВОЕ СООБЩЕНИЕ =====
            document.getElementById('serviceDetails').style.display = 'none';
            document.getElementById('successMessage').classList.add('show');

            // Закрываем через 2.5 секунды
            setTimeout(() => {
                closeModal();
                document.getElementById('successMessage').classList.remove('show');
                document.getElementById('serviceDetails').style.display = 'block';
            }, 2500);
        });
    </script>

</body>
</html>
