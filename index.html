<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Алгоритм.Дело — Услуги</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        /* ===== Жёсткая зелёная тема (не зависит от темы Telegram) ===== */
        :root {
            --bg: #f7fbf8;
            --text: #1e2e2a;
            --hint: #3b5f4e;
            --link: #2d6b4a;
            --btn: #2d6b4a;
            --btn-text: #ffffff;
            --card: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            padding: 16px 14px 30px;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
        }

        .header { text-align: center; margin-bottom: 20px; }

        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: #1a4a3a;
        }
        .logo span { color: var(--link); font-weight: 300; }

        .subtitle {
            font-size: 14px;
            color: var(--hint);
            margin-top: 4px;
        }

        .section-title {
            font-size: 18px;
            font-weight: 700;
            margin: 18px 0 12px;
            color: #0e2f24;
        }

        /* ===== Карточка ===== */
        .product-card {
            background: var(--card);
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 12px;
            border: 1.5px solid rgba(80, 140, 110, 0.1);
            transition: 0.2s;
            cursor: pointer;
            box-shadow: 0 2px 10px rgba(40, 80, 60, 0.04);
        }
        .product-card:active { transform: scale(0.99); }

        .product-card h3 {
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 4px;
            color: #0e2f24;
        }

        .product-price {
            font-size: 19px;
            font-weight: 700;
            color: var(--link);
            margin-bottom: 6px;
        }

        .product-desc {
            font-size: 13.5px;
            color: var(--hint);
            line-height: 1.45;
        }

        /* ===== Модалка ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(20, 45, 35, 0.6);
            backdrop-filter: blur(4px);
            display: none;
            align-items: flex-end;
            z-index: 999;
        }
        .modal-overlay.active { display: flex; }

        .modal-sheet {
            background: var(--card);
            width: 100%;
            max-height: 88vh;
            overflow-y: auto;
            border-radius: 22px 22px 0 0;
            padding: 22px 18px 30px;
            animation: slideUp 0.25s ease;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-handle {
            width: 40px;
            height: 4px;
            background: rgba(120, 140, 130, 0.4);
            border-radius: 4px;
            margin: 0 auto 14px;
        }

        .modal-sheet h2 {
            font-size: 21px;
            margin-bottom: 6px;
            color: #0e2f24;
        }

        .modal-price {
            font-size: 20px;
            font-weight: 700;
            color: var(--link);
            margin-bottom: 14px;
        }

        .modal-full-desc {
            font-size: 14.5px;
            white-space: pre-wrap;
            line-height: 1.55;
            margin-bottom: 20px;
            color: #1e3a30;
        }

        .modal-actions { display: flex; gap: 10px; }

        .modal-actions button {
            flex: 1;
            padding: 14px;
            border-radius: 14px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: 0.15s;
        }
        .modal-actions button:active { transform: scale(0.97); }

        .btn-ghost {
            background: rgba(120, 140, 130, 0.15);
            color: var(--text);
        }
        .btn-fill {
            background: var(--btn);
            color: var(--btn-text);
            box-shadow: 0 6px 18px rgba(45, 107, 74, 0.25);
        }

        /* ===== Инфо-блок ===== */
        .info-block {
            margin-top: 22px;
            padding: 16px;
            background: rgba(45, 107, 74, 0.08);
            border-radius: 16px;
            font-size: 13.5px;
            color: var(--hint);
            line-height: 1.5;
        }
        .info-block b { color: var(--link); }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">Алгоритм.<span>Дело</span></div>
        <div class="subtitle">Выберите услугу — мы свяжемся с вами</div>
    </div>

    <div class="section-title">Услуги</div>
    <div id="catalog"></div>

    <div class="info-block">
        💬 После нажатия «Оставить заявку» мы получим ваш <b>Telegram-профиль</b>
        и напишем вам прямо в этот чат. Никакие телефоны и почты указывать не нужно.
    </div>

    <!-- Модалка -->
    <div class="modal-overlay" id="modal">
        <div class="modal-sheet">
            <div class="modal-handle"></div>
            <h2 id="modalTitle">Название</h2>
            <div class="modal-price" id="modalPrice">от 0 ₽</div>
            <div class="modal-full-desc" id="modalDesc">Описание</div>
            <div class="modal-actions">
                <button class="btn-ghost" id="modalClose">Закрыть</button>
                <button class="btn-fill" id="modalSubmit">Оставить заявку</button>
            </div>
        </div>
    </div>

    <script>
        // ===== Telegram WebApp =====
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.ready();
            tg.expand();
            // Принудительно зелёная тема — не зависит от темы Telegram
            tg.setHeaderColor?.('#2d6b4a');
            tg.setBackgroundColor?.('#f7fbf8');
        }

        // ===== Данные услуг =====
        const products = [
            {
                id: 'tg',
                name: 'Telegram-бот',
                price: 'от 2 500 ₽',
                short: 'Бот с приветствием, FAQ, сбором заявок в таблицу и уведомлениями.',
                full: `Что входит: Быстрый старт. Бот с базовыми сценариями: приветствие, ответы на частые вопросы (FAQ), сбор заявок в одну таблицу (Google Sheets / CRM), уведомления администратору о новом клиенте.

Кому подойдёт: Сфера услуг, консультанты, маленькие кофейни, репетиторы, адвокаты.

Что получаете: Перестаёте отвечать на одни и те же вопросы по 100 раз. Бот забирает «холодные» заявки, пока вы спите.`
            },
            {
                id: 'maxbot',
                name: 'Макс-бот',
                price: 'от 3 000 ₽',
                short: 'Многопоточные сценарии, оплата картой, база клиентов, рассылки.',
                full: `Что входит: Многопоточные сценарии, оплата через карту внутри бота, привязка к базе клиентов, отправка файлов/чеков, автоматическая рассылка.

Кому подойдёт: Онлайн-школы, интернет-магазины, сети клиник, автомойки.

Что получаете: Полноценного «робота-продажника», который доводит клиента до покупки.`
            },
            {
                id: 'landing',
                name: 'Landing Site',
                price: 'от 4 000 ₽',
                short: 'Одностраничный сайт с высокой конверсией, метриками и адаптивом.',
                full: `Что входит: Одностраничный сайт с чёткой структурой, формами захвата, метрикой, SEO и адаптивом под телефоны.

Кому подойдёт: Запуск нового продукта, акции, вебинары, сбор лидов.

Что получаете: Страницу, которая конвертирует 3-5% трафика в заявки.`
            },
            {
                id: 'site',
                name: 'Обычный сайт',
                price: 'от 9 990 ₽',
                short: '3–5 страниц, админка, SSL, регистрация в поисковиках.',
                full: `Что входит: 3-5 страниц, установка на хостинг, SSL, простая админка (WordPress / ModX), регистрация в поисковых системах.

Кому подойдёт: Строительные компании, стоматологии, юридические бюро, салоны красоты.

Что получаете: Доверие клиентов. Сайт, который не стыдно отправить партнёру.`
            },
            {
                id: 'catalog',
                name: 'Сайт с каталогом товаров',
                price: 'от 15 000 ₽',
                short: 'Умная витрина: фильтры, поиск, корзина, заказ в пару касаний.',
                full: `Мы создаём удобный каталог: категории, фильтры, поиск, детальные карточки, корзина, оформление заказа.

Кому подойдёт: магазины одежды, стройматериалов, мебели, зоотоваров.

Ключевая фишка: каталог растёт вместе с вами через простую админку.`
            },
            {
                id: 'db',
                name: 'Сайт с базой данных',
                price: 'от 25 000 ₽',
                short: 'Личные кабинеты, отчёты, интеграции, защита от утечек.',
                full: `Что входит: Проектирование БД, личные кабинеты с правами доступа, история действий, выгрузка в Excel/CSV, интеграция с API. Защита от SQL-инъекций.

Кому подойдёт: Логистика, агрегаторы, сети ресторанов, сервисные центры.

Что получаете: Цифровой нерв бизнеса — инструмент управления компанией.`
            },
            {
                id: 'unity',
                name: 'Unity (игры / симуляторы)',
                price: 'Договорная',
                short: '2D/3D игры, симуляторы, визуализация, помощь в доработке.',
                full: `Что входит:
• С нуля: 2D/3D игры под Windows, Android, iOS. Аркады, квесты, симуляторы, визуализация.
• Помощь: доработка вашего проекта, оптимизация, исправление багов, физика, AI.

Кому подойдёт: гейм-студиям, архитекторам, производственным компаниям.

Важно: цена определяется после 15-минутной демонстрации идеи.`
            }
        ];

        // ===== Рендер карточек =====
        const catalogEl = document.getElementById('catalog');
        products.forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.innerHTML = `
                <h3>${p.name}</h3>
                <div class="product-price">${p.price}</div>
                <div class="product-desc">${p.short}</div>
            `;
            card.addEventListener('click', () => openModal(p.id));
            catalogEl.appendChild(card);
        });

        // ===== Модалка =====
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modalTitle');
        const modalPrice = document.getElementById('modalPrice');
        const modalDesc = document.getElementById('modalDesc');
        let currentProduct = null;

        function openModal(id) {
            currentProduct = products.find(x => x.id === id);
            if (!currentProduct) return;
            modalTitle.textContent = currentProduct.name;
            modalPrice.textContent = currentProduct.price;
            modalDesc.textContent = currentProduct.full;
            modal.classList.add('active');
            tg?.BackButton?.show();
        }

        function closeModal() {
            modal.classList.remove('active');
            tg?.BackButton?.hide();
        }

        document.getElementById('modalClose').addEventListener('click', closeModal);
        modal.addEventListener('click', e => {
            if (e.target === modal) closeModal();
        });
        tg?.BackButton?.onClick(() => closeModal());

        // ===== Отправка заявки =====
        document.getElementById('modalSubmit').addEventListener('click', () => {
            if (!currentProduct) return;

            if (!tg) {
                alert('Откройте это приложение через Telegram-бота.');
                return;
            }

            // Формат: service_id|service_name|price
            const payload = [
                currentProduct.id,
                currentProduct.name,
                currentProduct.price
            ].join('|');

            console.log('Sending payload:', payload); // для отладки

            try {
                tg.sendData(payload);
                tg.HapticFeedback?.notificationOccurred('success');
            } catch (e) {
                alert('Ошибка отправки: ' + e.message);
            }
        });
    </script>
</body>
</html>
